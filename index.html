<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CariHotel - Compare Hotel Prices</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            Cari<span>Hotel</span>
        </div>

        <nav>
            <a href="#">Hotels</a>
            <a href="#">Deals</a>
            <a href="#">Destinations</a>
        </nav>

    </header>


    <section class="hero">

        <h1>Find Your Hotel for Less</h1>

        <p>
            Compare hotel prices and find the best available deal.
        </p>


        <div class="search-box">

           <input 
    type="text" 
    id="destination"
    placeholder="Where do you want to stay?"
>

            <input 
                type="date"
            >

            <input 
                type="date"
            >

            <input 
                type="number" 
                placeholder="Guests"
                min="1"
                value="2"
            >

            <button id="searchButton">
                SEARCH
            </button>

        </div>

    </section>


 <section class="section" id="resultsSection">

    <h2>Hotel Results</h2>

    </div>

</section>


    <footer>
